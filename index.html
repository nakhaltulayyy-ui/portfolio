<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Louay Mazkour | MAX 3D Mobile Portfolio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
:root{
--bg:#050505;
--text:#f5f0e8;
--glass:rgba(255,255,255,0.06);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system;}

body{
background:var(--bg);
overflow:hidden;
color:var(--text);
}

/* ===== CINEMATIC BACKGROUND ENGINE ===== */
.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(255,255,255,0.05), transparent 40%),
radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03), transparent 60%);
animation:move 10s infinite alternate ease-in-out;
}

@keyframes move{
0%{transform:scale(1) rotate(0deg);}
100%{transform:scale(1.2) rotate(10deg);}
}

/* ===== LIGHT FOLLOW ===== */
.light{
position:fixed;
width:250px;
height:250px;
background:radial-gradient(circle,rgba(255,255,255,0.15),transparent);
pointer-events:none;
mix-blend-mode:screen;
}

/* ===== WRAPPER ===== */
.wrapper{
height:100vh;
width:100vw;
perspective:1600px;
}

/* ===== SLIDES ===== */
.slide{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;

opacity:0;
transform:translateZ(-300px) scale(0.8);
transition:1s cubic-bezier(.2,.8,.2,1);
}

.slide.active{
opacity:1;
transform:translateZ(0px) scale(1);
}

.slide.prev{
transform:translateX(-50%) rotateY(45deg);
opacity:0;
}

.slide.next{
transform:translateX(50%) rotateY(-45deg);
opacity:0;
}

/* ===== CARD ===== */
.card{
width:90%;
height:62vh;
border-radius:30px;
overflow:hidden;
position:relative;
border:1px solid rgba(255,255,255,0.12);
transform-style:preserve-3d;
box-shadow:0 30px 80px rgba(0,0,0,0.6);
}

.card img, .card video{
width:100%;
height:100%;
object-fit:cover;
transform:scale(1.1);
filter:contrast(1.1) saturate(1.1);
}

.glass{
position:absolute;
inset:0;
background:var(--glass);
backdrop-filter:blur(18px);
}

/* TEXT */
.card h2{
position:absolute;
bottom:25px;
left:25px;
font-size:8vw;
letter-spacing:-1px;
}

/* HERO */
.hero h1{
font-size:16vw;
line-height:0.85;
}

/* BUTTON */
.btn{
padding:14px 22px;
margin:10px;
border-radius:14px;
border:1px solid rgba(255,255,255,0.2);
text-decoration:none;
color:var(--text);
}

.btn:active{transform:scale(0.95);}

/* DOTS */
.dots{
position:fixed;
right:10px;
top:50%;
transform:translateY(-50%);
display:flex;
flex-direction:column;
gap:8px;
}

.dot{
width:6px;height:6px;border-radius:50%;
background:rgba(255,255,255,0.2);
}

.dot.active{background:white;}
</style>
</head>

<body>

<div class="bg"></div>
<div class="light" id="light"></div>

<div class="wrapper">

<!-- HERO -->
<section class="slide active hero">
<h1>LOUAY<br>MAZKOUR</h1>
</section>

<!-- ABOUT VIDEO -->
<section class="slide">
<div class="card">
<video autoplay muted loop playsinline>
<source src="https://www.w3schools.com/html/movie.mp4">
</video>
<div class="glass"></div>
<h2>ABOUT</h2>
</div>
</section>

<!-- EVENTS -->
<section class="slide">
<div class="card">
<img src="https://images.unsplash.com/photo-1511578314322-379afb476865?q=80&w=1200">
<div class="glass"></div>
<h2>EVENTS</h2>
</div>
</section>

<!-- BAR -->
<section class="slide">
<div class="card">
<img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?q=80&w=1200">
<div class="glass"></div>
<h2>BAR</h2>
</div>
</section>

<!-- BRAND -->
<section class="slide">
<div class="card">
<img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200">
<div class="glass"></div>
<h2>BRAND</h2>
</div>
</section>

<!-- MEDIA VIDEO -->
<section class="slide">
<div class="card">
<video autoplay muted loop playsinline>
<source src="https://www.w3schools.com/html/mov_bbb.mp4">
</video>
<div class="glass"></div>
<h2>MEDIA</h2>
</div>
</section>

<!-- CONTACT -->
<section class="slide">
<h2 style="font-size:12vw">CONTACT</h2>

<a class="btn" href="tel:+96171456396">CALL</a>
<a class="btn" href="cv.pdf" download>DOWNLOAD CV</a>

</section>

</div>

<div class="dots"></div>

<script>
let index=0;
const slides=document.querySelectorAll(".slide");
const dotsContainer=document.querySelector(".dots");

/* dots */
slides.forEach(()=>{
const d=document.createElement("div");
d.className="dot";
dotsContainer.appendChild(d);
});

const dots=document.querySelectorAll(".dot");

function update(){
slides.forEach((s,i)=>{
s.classList.remove("active","prev","next");

if(i===index)s.classList.add("active");
else if(i<index)s.classList.add("prev");
else s.classList.add("next");
});

dots.forEach((d,i)=>{
d.classList.toggle("active",i===index);
});
}

/* SWIPE PHYSICS */
let startY=0;

document.addEventListener("touchstart",e=>{
startY=e.touches[0].clientY;
});

document.addEventListener("touchend",e=>{
let endY=e.changedTouches[0].clientY;

let diff=startY-endY;

if(Math.abs(diff)>40){
index+=diff>0?1:-1;
index=Math.max(0,Math.min(index,slides.length-1));

gsap.to(".slide",{duration:0.8,ease:"power3.out"});
update();
}
});

/* LIGHT FOLLOW */
const light=document.getElementById("light");

document.addEventListener("touchmove",e=>{
light.style.left=e.touches[0].clientX-120+"px";
light.style.top=e.touches[0].clientY-120+"px";
});

/* GYRO 3D */
window.addEventListener("deviceorientation",e=>{
let x=e.gamma||0;
let y=e.beta||0;

document.querySelectorAll(".card").forEach(c=>{
c.style.transform=`rotateY(${x/6}deg) rotateX(${y/8}deg)`;
});
});

update();
</script>

</body>
</html>
